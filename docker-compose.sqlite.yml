version: '3.8'

services:
  sqlite-server:
    build:
      context: .
      dockerfile: Dockerfile.sqlite
    container_name: solarmonitor-sqlite
    ports:
      - "8002:8002"
    volumes:
      - sqlite_data:/data
    environment:
      - TZ=Europe/Berlin
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  sqlite_data:
    driver: local
